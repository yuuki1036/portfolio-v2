onlyBuiltDependencies:
  - esbuild
  - lightningcss
overrides:
  vite@*: "catalog:"
  # Security: lift transitive deps out of vulnerable ranges (Dependabot alerts)
  # tsx < 4.22 pins esbuild ~0.27 (GHSA for esbuild < 0.28.1)
  "tsx@<4.22.0": ^4.22.0
  # @tailwindcss/typography pins postcss-selector-parser 6.0.10 (< 6.1.5)
  "postcss-selector-parser@<6.1.5": ^6.1.5
  # glob 13 (via @storybook/react-vite) pins minimatch ^10 (GHSA-g3hv-75wg-m249 for minimatch < 11.0.1).
  # Override glob, not minimatch: glob 13 ESM + minimatch 11 silently matches nothing.
  "glob@>=13.0.0 <14.0.0": ^14.0.3
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
