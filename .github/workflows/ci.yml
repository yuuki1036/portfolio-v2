name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          cache: true

      - name: Generate paraglide i18n
        run: npx @inlang/paraglide-js compile --outdir ./src/paraglide

      - name: Lint, format & type check
        run: vp check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          cache: true

      - name: Build
        run: vp build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          cache: true

      - name: Generate paraglide i18n
        run: npx @inlang/paraglide-js compile --outdir ./src/paraglide

      - name: Unit tests
        run: vp test run --passWithNoTests

  storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          cache: true

      - name: Generate paraglide i18n
        run: npx @inlang/paraglide-js compile --outdir ./src/paraglide

      - name: Build Storybook
        run: vp run build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          cache: true

      - name: Generate paraglide i18n
        run: npx @inlang/paraglide-js compile --outdir ./src/paraglide

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Smoke test
        run: vp run test:e2e
